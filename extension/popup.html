<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>trackthoughts</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <div class="header-row">
        <p class="logo">trackthoughts</p>
        <span id="status-dot" class="status-dot"></span>
      </div>

      <p id="action-error" class="action-error hidden"></p>

      <div id="connect-view" class="hidden">
        <p class="intro">connect Spotify to see what your songs mean.</p>
        <button id="connect-button">connect Spotify</button>
      </div>

      <div id="status-view" class="hidden">
        <p class="intro" id="status-text"></p>
        <button id="refresh-button">refresh</button>
      </div>

      <div id="song-view" class="hidden">
        <div class="song-header">
          <img id="song-art" class="song-art" alt="" />
          <div>
            <h2 id="song-title"></h2>
            <p class="artist" id="song-artist"></p>
            <a id="song-link" class="spotify-link" target="_blank" rel="noreferrer"
              >open in Spotify ↗</a
            >
          </div>
          <span id="eq" class="eq hidden">
            <span></span><span></span><span></span>
          </span>
        </div>

        <div id="progress-section" class="progress-section hidden">
          <input id="progress-bar" class="range-input" type="range" min="0" max="100" value="0" />
          <div class="time-row">
            <span id="elapsed-label">0:00</span>
            <span id="duration-label">0:00</span>
          </div>
        </div>

        <div id="volume-section" class="volume-section hidden">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
            <path
              d="M4 9v6h4l5 5V4L8 9H4z"
              fill="currentColor"
            />
            <path
              d="M16.5 8.5a5 5 0 010 7"
              stroke="currentColor"
              stroke-width="1.6"
              stroke-linecap="round"
            />
          </svg>
          <input id="volume-slider" class="range-input" type="range" min="0" max="100" value="50" />
        </div>

        <div class="tabs">
          <button id="tab-meaning" class="tab-button active">Meaning</button>
          <button id="tab-lyrics" class="tab-button">Lyrics</button>
        </div>

        <div id="meaning-panel">
          <div id="explain-block">
            <button id="explain-button">explain this song</button>
          </div>

          <p id="meaning-loading" class="intro hidden">finding the feeling...</p>

          <div id="meaning-block" class="meaning hidden">
            <p class="meaning-label">what this song means</p>
            <p id="meaning-text"></p>
            <p id="meaning-detail"></p>
            <div class="themes" id="meaning-themes"></div>

            <div id="deeper-block" class="hidden">
              <button id="deeper-button">go deeper</button>
            </div>

            <p id="deep-loading" class="intro hidden">sitting with it a little longer...</p>

            <div id="deep-block" class="deep hidden">
              <p class="meaning-label">going deeper</p>
              <div id="deep-text"></div>
            </div>
          </div>
        </div>

        <div id="lyrics-panel" class="hidden">
          <div id="lyrics-list" class="lyrics-list">
            <p class="lyrics-empty">Loading lyrics...</p>
          </div>
        </div>

        <button id="refresh-button-2">refresh</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
